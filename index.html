      rel="stylesheet"
    />
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        const locale = localStorage.getItem('locale');
        if (locale === 'fr' || locale === 'en') document.documentElement.lang = locale;
        else if (navigator.language.toLowerCase().startsWith('fr')) document.documentElement.lang = 'fr';
        const saved = localStorage.getItem('theme');
        const theme =
          saved ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
